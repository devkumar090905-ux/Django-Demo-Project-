{% extends 'base.html' %}

{% block title %}  Data {% endblock title %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>show data</title>
</head>
<body>
    {% block content %}
    <div class="container">
        <div class="row">
                <h2>Database data</h2>
    <table border="3">
        <tr class="border-2">
            <th>Name</th>
            <th>Email</th>
            <th>Number</th>
            <th>Action</th>
        </tr>
        {% for i in data %}
        <tr>
            <td class="border-3">{{i.name}}</td>
            <td class="border-3">{{i.email}}</td>
            <td class="border-3">{{i.number}}</td>
            <td class="border-3">
                <a href="{% url 'update_data' i.id %}">
                    <button>Edit</button>
                </a>
                <a href="{% url 'delete_data' i.id %}" onclick="return confirm('Are you sure?')">
                    <button>Delete</button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
        </div>
    </div>
    {% endblock %}
</body>
</html>
