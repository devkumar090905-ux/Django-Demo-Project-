{% extends 'base.html' %}

{% block title %} Home {% endblock title %}


{% block content %}
<div class="my-3">
<h1><center> Welcome to Home page</center> </h1>
</div>
<div class="container my-3 mb-3 p-3 border border-2 border-dark rounded">
    <form method="POST" action="/">
        {% csrf_token %}    
        <div class="mb-3">
            <label for="name" class="form-label" name="name"> Enter your name</label>
            <input  class="form-control" id="name" name="name" >
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        
        <div class="mb-3">
            <label for="nnumber" class="form-label">PassEnter your number</label>
            <input type="number" class="form-control" name="number" id="number">
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}

{{variable}}
